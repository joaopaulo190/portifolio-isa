# Configuração para o Render (plano gratuito).
# No Render: New → Blueprint → escolha este repositório.
services:
  - type: web
    name: isabela-medeiros
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false        # o Render vai pedir para você colar
      - key: TURSO_AUTH_TOKEN
        sync: false        # o Render vai pedir para você colar
      - key: ADMIN_PASSWORD
        sync: false        # sua senha da área da personal
      - key: COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY
        value: "true"
